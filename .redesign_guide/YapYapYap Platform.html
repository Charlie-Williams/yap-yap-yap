<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YapYapYap · Full platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#FFDE21"/>
    <circle cx="50" cy="52" r="26" fill="#FFFBE6" stroke="#1A1A17" stroke-width="3"/>
    <circle cx="44" cy="48" r="4" fill="#1A1A17"/>
    <path d="M58 52l10 3-10 3z" fill="#E7A100" stroke="#1A1A17" stroke-width="2" stroke-linejoin="round"/>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app-shared.jsx?v=5"></script>
<script type="text/babel" src="shell.jsx?v=5"></script>
<script type="text/babel" src="states.jsx?v=5"></script>
<script type="text/babel" src="settings.jsx?v=5"></script>
<script type="text/babel" src="menus.jsx?v=5"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard,
    ScreenIdle, ScreenRecording, ScreenProcessing, ScreenGenerating,
    ScreenTranscript, ScreenGenerateCTA, ScreenWelcome,
    SettingsGeneral, SettingsModels, SettingsNotes, SettingsProjects,
    ConvMenuDetail, ProjectMenuDetail } = window;

  const board = { background: '#f0eee9', boxShadow: 'none', borderRadius: 0, overflow: 'visible' };
  const AB = (id, label, w, h, node) => (
    <DCArtboard id={id} label={label} width={w} height={h} style={board}>{node}</DCArtboard>
  );

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="main" title="Main window — states"
          subtitle="Direction B · the one app window, every state it moves through">
          {AB('idle', 'Idle · viewing notes', 1080, 720, <ScreenIdle />)}
          {AB('rec', 'Recording', 1080, 720, <ScreenRecording />)}
          {AB('proc', 'Processing · transcribing', 1080, 720, <ScreenProcessing />)}
          {AB('gen', 'Generating AI notes', 1080, 720, <ScreenGenerating />)}
          {AB('tx', 'Transcript view', 1080, 720, <ScreenTranscript />)}
          {AB('cta', 'Has transcript · no notes yet', 1080, 720, <ScreenGenerateCTA />)}
          {AB('welcome', 'First run · empty', 1080, 720, <ScreenWelcome />)}
        </DCSection>

        <DCSection id="settings" title="Settings"
          subtitle="Opened from the sidebar · four tabs">
          {AB('s-gen', 'General', 720, 600, <SettingsGeneral />)}
          {AB('s-models', 'AI Models', 720, 600, <SettingsModels />)}
          {AB('s-notes', 'AI Notes', 720, 600, <SettingsNotes />)}
          {AB('s-proj', 'Projects', 720, 600, <SettingsProjects />)}
        </DCSection>

        <DCSection id="menus" title="Menus & details"
          subtitle="Context actions">
          {AB('m-conv', 'Conversation menu', 560, 380, <ConvMenuDetail />)}
          {AB('m-proj', 'Project picker', 340, 300, <ProjectMenuDetail />)}
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
