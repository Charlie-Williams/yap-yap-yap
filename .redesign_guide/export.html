<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YapYapYap · export</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
  .shot { padding: 28px; display: inline-block; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app-shared.jsx?v=5"></script>
<script type="text/babel" src="shell.jsx?v=5"></script>
<script type="text/babel" src="states.jsx?v=5"></script>
<script type="text/babel" src="settings.jsx?v=5"></script>
<script type="text/babel" src="menus.jsx?v=5"></script>
<script type="text/babel">
  const W = window;
  const SCREENS = {
    'idle': <W.ScreenIdle />, 'recording': <W.ScreenRecording />, 'processing': <W.ScreenProcessing />,
    'generating': <W.ScreenGenerating />, 'transcript': <W.ScreenTranscript />, 'generate-cta': <W.ScreenGenerateCTA />,
    'welcome': <W.ScreenWelcome />,
    'settings-general': <W.SettingsGeneral />, 'settings-models': <W.SettingsModels />,
    'settings-notes': <W.SettingsNotes />, 'settings-projects': <W.SettingsProjects />,
    'menu-conversation': <W.ConvMenuDetail />, 'menu-project': <W.ProjectMenuDetail />,
  };
  const DIMS = {
    'idle': [1080, 720], 'recording': [1080, 720], 'processing': [1080, 720],
    'generating': [1080, 720], 'transcript': [1080, 720], 'generate-cta': [1080, 720], 'welcome': [1080, 720],
    'settings-general': [720, 600], 'settings-models': [720, 600], 'settings-notes': [720, 600], 'settings-projects': [720, 600],
    'menu-conversation': [560, 380], 'menu-project': [340, 300],
  };
  function One({ id }) {
    const [w, h] = DIMS[id] || [1080, 720];
    const scale = Math.min(1, 856 / w);
    return (
      <div className="shot" data-shot={id} style={{ padding: 24 }}>
        <div style={{ width: w * scale, height: h * scale }}>
          <div style={{ width: w, height: h, transform: `scale(${scale})`, transformOrigin: 'top left' }}>
            {SCREENS[id] || <div>unknown: {id}</div>}
          </div>
        </div>
      </div>
    );
  }
  const root = ReactDOM.createRoot(document.getElementById('root'));
  window.renderScreen = (id) => root.render(<One id={id} />);
  window.renderScreen(new URLSearchParams(location.search).get('s') || 'idle');
</script>
</body>
</html>
